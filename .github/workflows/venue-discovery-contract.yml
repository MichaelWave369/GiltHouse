name: Gilt House standalone boundary contract

on:
  pull_request:
    paths:
      - "public/bridge/**"
      - "docs/GILTHOUSE-STANDALONE-BOUNDARY-R0.md"
      - "scripts/gilt-venue-manifest.test.mjs"
      - ".github/workflows/venue-discovery-contract.yml"
  push:
    branches: [main]
    paths:
      - "public/bridge/**"
      - "docs/GILTHOUSE-STANDALONE-BOUNDARY-R0.md"
      - "scripts/gilt-venue-manifest.test.mjs"
      - ".github/workflows/venue-discovery-contract.yml"

jobs:
  standalone-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce independence from paid Neon Royal product
        run: node --test scripts/gilt-venue-manifest.test.mjs
